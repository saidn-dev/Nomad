; Nomad Milestone 2 — ESP-NOW two-way bench-test firmware
;
; Target board : ESP32-C3 SuperMini (USB-C, 4 MB flash)
;                PlatformIO board id: esp32-c3-devkitm-1
; Framework    : Arduino (per PLAN.md §5)
;
; Toolchain choice (see ../MILESTONE-2-PREP.md §6):
;   PRIMARY  — pioarduino stable (community fork of the PlatformIO platform that
;              tracks the official Espressif Arduino core). Currently Arduino
;              3.3.12 / ESP-IDF 5.5.5, which includes Espressif's 2025 fixes for
;              ESP-NOW + BLE coexistence (IDF 5.5.0 -> 5.5.1, GitHub issue
;              espressif/esp-idf#17874). The sketch's callback shims target it.
;   FALLBACK — official PlatformIO platform, which is capped at Arduino 2.0.17 /
;              IDF 4.4.7 (no 2025 coexistence fixes). Only use if the pioarduino
;              download fails; uncomment the line below and comment the primary.
[env:esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; platform = espressif32 @ 6.13.0   ; FALLBACK: Arduino 2.0.17 / IDF 4.4.7
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; SuperMini has no USB-UART bridge: the USB-C port is the ESP32-C3's native
; USB-Serial/JTAG peripheral. Without these flags Serial would be routed to the
; broken-out UART0 pins and the serial monitor would show nothing.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
