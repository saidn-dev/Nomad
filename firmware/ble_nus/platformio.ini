; Nomad Milestone 2 — BLE (Nordic UART Service) peripheral test firmware
;
; Target board : ESP32-C3 SuperMini (USB-C, 4 MB flash)
;                PlatformIO board id: esp32-c3-devkitm-1
; Framework    : Arduino + NimBLE-Arduino (per PLAN.md §5: "lightweight BLE stack")
;
; Toolchain: same pioarduino-stable primary / official-platform fallback as
; ../espnow_two_way/platformio.ini — see ../../MILESTONE-2-PREP.md §6.
[env:esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; platform = espressif32 @ 6.13.0   ; FALLBACK: Arduino 2.0.17 / IDF 4.4.7
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

lib_deps =
    h2zero/NimBLE-Arduino @ ^2.5.0

; SuperMini: native USB-Serial/JTAG (no bridge chip) — required for Serial.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
